name: Documentation Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: site

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: site
      - uses: actions/configure-pages@v5
        id: pages
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          working-directory: site
          bundler-cache: true
      - name: Build Markdown documentation
        env:
          JEKYLL_ENV: production
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: bundle exec jekyll build --strict_front_matter --baseurl "$PAGES_BASE_PATH"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
