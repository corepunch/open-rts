///////////////////////////////////////////////////////////////////////////////
// KNOBS
// -------------------
// 5-Position Knobs for AIP modification layout
struct KNOBS
{
  char display_name[80];				// The name to display in the editor
  char param_name[80];          // The name of the AIP parameter
  int x;                        // Position of knob on screen
  int y;                        // Ditto
  int value_1;                  // A Value for parameter at knob setting
  int value_2;                  // A Value for parameter at knob setting
  int value_3;                  // A Value for parameter at knob setting
  int value_4;                  // A Value for parameter at knob setting
  int value_5;                  // A Value for parameter at knob setting
  int default_value;            // Which knob setting should we use?
};


#define MAX_KNOBS 30            // There'll never be more than n knobs


// THE KNOB ARRAY
KNOBS My_Knobs[MAX_KNOBS];

#DATA
// DISPLAY          PARAMETER                      X      Y       V1   V2   V3   V4   V5  DEFAULT
// -------          ---------                      --     --      --   --   --   --   --  ------- 
#END_DATA

#define INT 0
#define FLOAT 1
#define DOUBLE 2

#define BOUNDED 1
#define UNBOUNDED 0

///////////////////////////////////////////////////////////////////////////////
// EDIT_VALUES
// -------------------
// Certain parameters can be edited and have the values raised or lowered with
// arrow buttons.
struct EDIT_VALUES
{
  char display_name[80];	// The name to display in the editor
  char param_name[80];          // The name of the AIP parameter
  int type;                     // What sort of value is this
  int x;                        // Position of knob on screen
  int y;                        // Ditto
  int height;                   // Dimensions of edit box
  int width;
  int default_value;         // Which value does it hold by default
  double slow_change;           // When we first click, how much do we move by?
  double fast_change;           // If we hold it down, how much do we move by?
  int bounded;                  // Are there limits on this?
  int lower_bound;           // Boundary limit for edit box
  int upper_bound;
};

#define MAX_EDIT_VALUES 30

// The edit values for this AIP
EDIT_VALUES My_Edit_Values[MAX_EDIT_VALUES];

