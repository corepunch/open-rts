;
; Tactics Engine Settings
;
[EngineSetup]

; The name of the game being played
GameName=dark

; Where to look for game data
HomeDir=e:\REIGN

; Sound cache in kbytes
SoundCache=256

; Enable digital audio
EnableDigAudio=1

; Enable CD audio
EnableCDAudio=0


;
; Logging Preferences
;
[Logging]

; Clear the log at startup
ClearLog=1

; Display Errors in the log
EnableErrors=1

; Display Warnings in the log
EnableWarnings=1

; Display Diagnostics in the log
EnableDiagnostics=1

; Display Network Errors in the log
EnableNetErrors=1

; Write Log to file
LogToFile=1


;
; File logging preferences
;
[Logging.File]

; Log File
Name=tactics.log


;
; Log message verbosity
;
[Logging.Verbosity]

; Display word for error type
DisplayWordError=1

; Display file where error occured
DisplayErrorFilename=1

; Display line number where error occured
DisplayErrorLine=1

; Display time the error occured
DisplayTime=1

; Use ASCII characters in display
DisplayASCII=0


;
; In game settings
;
[UserPreferences]

; Enter fire mode automatically
DefaultFire=1

; Enter move mode automatically
DefaultMove=1

; Enable sound panning
EnablePanning=0

; Milliseconds till info/tips displayed
InfoDelay=800

; Volume of digital audio
DigitalVolume=99

; Single player game speed
GameSpeed=22

; Screen scroll speed
ScrollSpeed=5


;
; Multiplayer settings
;
[MultiPlayer]

; Player name in multi player games
PlayerName=Player

; ActiveNet Server to Use
ActiveNetServer=darkreign.activision.com

; ActiveNet Default to Server Selection
ActiveNetScan=1

; Selected Modem
Modem=


;
; Multiplayer direct serial connect settings
;
[MultiPlayer.Serial]
Port=COM2
Baud=9600


;
; Multiplayer phone book
;
[MultiPlayer.PhoneBook]


;
; Multiplayer address book
;
[MultiPlayer.AddressBook]

