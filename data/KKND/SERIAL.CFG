##############################################################################
#									     #
#			   SERIAL.CFG for PC NETZ			     #
#		    Specifies setup of comport parameters		     #
#									     #
#		    Any line beginning with '#' is ignored                   #
#									     #
##############################################################################
# COM PORT SETTING
#
# Set your Comport number here. Default setting is 2. Any value between 1 and
# 4 might be valid for your computer.
# comm 1 = PORT 1
# comm 2 = PORT 2
# comm 3 = PORT 3
# comm 4 = PORT 4
#
# Modify PORT 2 (below) to set your com port number.

PORT 2


#############################################################################
# MODEM INITIALISATION STRING
#
# Listed below are initialisation strings for a wide variety of modems. If
# your modem is not listed here, please consult you modem manual for the
# correct initialisation string.
#
# MODEM TYPE			 ³INITIALISATION STRING
# ÄÄÄÄÄÄÄÄÄÄÄÄÄÄÄÄÄÄÄÄÄÄÄÄÄÄÄÄÄÄÄÅÄÄÄÄÄÄÄÄÄÄÄÄÄÄÄÄÄÄÄÄÄ
# Generic 1 (Default)		 ³ INITSTRING AT&ff
# Generic 2			 ³ INITSTRING AT&ff8
# GVC14400			 ³ INITSTRING AT&f%CO&KO\GO\NI
# Hayes 28800			 ³ INITSTRING AT&f&KNOS37=9
# Hayes 14400			 ³ INITSTRING AT&f&KNOS37=9&Q6\NI
# Hayes 14400B			 ³ INITSTRING AT&f&KNOS37=9
# Hayes 9600			 ³ INITSTRING AT&f&KNOS37=9
# Intel SatisFAXtion		 ³ INITSTRING AT&f\GO\QO\NO%CO,,,
# Practical Peripherals 14400	 ³ INITSTRING AT&f&KNOS37=9
# Supra FAXModerm 14400 	 ³ INITSTRING AT&f\NI%C&KNOS37=9
# Supra FAXModerm 28800 	 ³ INITSTRING AT&f\NI%C&KNOS37=9
# USRobotics Sportster		 ³ INITSTRING AT&f&N6&M&K&1
# USRobotics Courier		 ³ INITSTRING AT&f&N6&M&K&1
# USRobotics Terbo		 ³ INITSTRING AT&f&N6&M&K&1
# Zoom 14400			 ³ INITSTRING AT&ff8&K&Q6
# Zoom 28800			 ³ INITSTRING AT&ff8&K
# Zoom V34			 ³ INITSTRING AT&ff8&K
#
#Modify INITSTRING at&ff (below) to use your modem initialisation string

INITSTRING at&ff


#############################################################################
# MODEM DIALING METHOD
#
# For tone dialing use	DIALMETHOD atdt
# For pulse dialing use DIALMETHOD atdp
#
#Modify DIALMETHOD atdt (below) to set your preferred dialing method.

DIALMETHOD atdt


#############################################################################
# COM PORT BAUD RATE
#
# Set the baud rate of your comm port in BPS (bits per second).
# Do not confuse with modem BPS which is usually less than or equal to this)
# Default value is 19200.
# Allowable values are:-
# BPS 9600
# BPS 19200
# BPS 38400
# BPS 57600
# BPS 115200
#
# Modify BPS 9600 (below) to set your comm port baud rate.

BPS 9600

